<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Cinema Choopistha. Movie nights for Kittu and Subbu.">
  <title>Cinema Choopistha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="wordmark" href="./" id="homeLogo" aria-label="Cinema Choopistha home">
      <span class="wordmark-icon" aria-hidden="true">c<span>.</span></span>
      <span>cinema <strong>choopistha</strong></span>
    </a>
    <div class="top-actions" id="topActions" hidden>
      <span class="signed-in-name" id="signedInName">Kittu</span>
      <button class="avatar-button" id="switchProfileBtn" type="button" title="Switch profile" aria-label="Switch profile">K</button>
    </div>
  </header>

  <main id="loginView" class="login-view">
    <section class="profile-stage">
      <span class="small-heart" aria-hidden="true">♥</span>
      <h1>Who's watching?</h1>
      <p>Movie nights, just us.</p>
      <div class="profile-grid" role="group" aria-label="Choose a profile">
        <button id="chooseKittu" class="profile-choice" type="button">
          <span class="profile-avatar avatar-kittu"><span>K</span></span>
          <strong>Kittu</strong>
        </button>
        <button id="chooseSubbu" class="profile-choice" type="button">
          <span class="profile-avatar avatar-subbu"><span>S</span></span>
          <strong>Subbu</strong>
        </button>
      </div>
      <p class="entry-message" id="entryMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <main id="homeView" class="home-view" hidden>
    <section class="feature" aria-label="Featured movie">
      <div class="feature-backdrop" id="featureBackdrop" aria-hidden="true"></div>
      <div class="feature-scrim" aria-hidden="true"></div>
      <div class="feature-inner">
        <div class="feature-copy">
          <p class="eyebrow">Tonight's pick</p>
          <h1 id="featureTitle">Our next movie night</h1>
          <div class="feature-meta" id="featureMeta">Just the two of us</div>
          <p id="featureDescription" class="feature-description">A good film is better together.</p>
          <div class="feature-actions">
            <button id="watchTogetherBtn" class="primary-button" type="button">
              <span class="play-triangle" aria-hidden="true">▶</span><span id="watchTogetherText">Watch together</span>
            </button>
          </div>
          <p class="inline-presence" id="homePresence" aria-live="polite"></p>
        </div>
        <div class="feature-poster-wrap" aria-hidden="true">
          <img class="feature-poster" id="featurePoster" alt="" src="./cinema-night.svg">
        </div>
      </div>
    </section>

    <section class="collection" aria-labelledby="libraryTitle">
      <div class="collection-heading">
        <h2 id="libraryTitle">Movies</h2>
        <button type="button" class="quiet-button" id="refreshLibraryBtn" title="Refresh movies" aria-label="Refresh movie library">
          <span aria-hidden="true">↻</span> <span>Refresh</span>
        </button>
      </div>
      <div class="movie-grid" id="movieGrid"><div class="loading-card" aria-hidden="true"></div></div>
    </section>
    <div class="quiet-footnote">Made for Kittu &amp; Subbu <span aria-hidden="true">♡</span></div>
  </main>

  <main id="watchView" class="watch-view" hidden>
    <div class="watch-shell">
      <div class="watch-top">
        <button type="button" id="backHomeBtn" class="back-button" aria-label="Back to movies"><span aria-hidden="true">←</span> Movies</button>
        <div class="watch-together-top">
          <div id="presenceKittu" class="presence-profile"><span class="presence-circle">K</span><span>Kittu</span></div>
          <div id="presenceSubbu" class="presence-profile"><span class="presence-circle">S</span><span>Subbu</span></div>
        </div>
      </div>

      <section class="theatre" aria-label="Video player">
        <div class="screen" id="playerShell">
          <video id="player" playsinline preload="metadata" crossorigin="anonymous"></video>
          <div id="playerEmpty" class="screen-empty">
            <span aria-hidden="true" class="screen-play-symbol">▶</span>
            <p>Select a movie to begin.</p>
          </div>
          <div id="loadingVideo" class="loading-video" hidden aria-live="polite"><span class="spinner"></span></div>
          <button id="localPlayBtn" type="button" class="tap-to-play" hidden><span aria-hidden="true">▶</span> Tap to play</button>
        </div>
        <div class="playbar">
          <button id="playPauseBtn" class="player-button main-player-button" type="button" aria-label="Play" disabled><span aria-hidden="true">▶</span></button>
          <span id="currentTime" class="timecode">0:00</span>
          <input id="seekBar" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="Seek movie">
          <span id="duration" class="timecode">0:00</span>
          <button id="captionsBtn" class="player-button" type="button" aria-label="Toggle subtitles" title="Subtitles" hidden>CC</button>
          <button id="muteBtn" class="player-button" type="button" aria-label="Mute" title="Mute">◖))</button>
          <button id="pipBtn" class="player-button pip-button" type="button" aria-label="Picture in picture" title="Picture in picture">▣</button>
          <button id="fullscreenBtn" class="player-button" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
        </div>
      </section>
      <div class="watch-info">
        <div>
          <h1 id="playingTitle">Our cinema</h1>
          <p id="playerNote" class="player-note" hidden></p>
        </div>
        <p class="connection-state" id="connectionState"><span class="connection-dot"></span><span id="connectionText">Connecting…</span></p>
      </div>
      <div class="up-next">
        <div class="up-next-title"><h2>Movies</h2><button class="quiet-button" id="refreshWatchBtn" type="button" title="Refresh movies" aria-label="Refresh movies">↻</button></div>
        <div class="up-next-grid" id="watchMovieGrid"></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
